<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apleq - Gestor de Suscripciones Compartidas</title>
    <meta name="description" content="Gestor y optimizador de suscripciones compartidas Apleq con sincronización en Cloud Firestore, Together Price, Sharesub, control de pagos y cálculo de ahorro neto." />
    <link rel="icon" href="/apleq_favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/apleq_favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Apply theme before render to prevent flash
      try {
        const theme = localStorage.getItem('splitzy_theme') || 'dark';
        if (theme === 'dark' || !theme) document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="font-sans antialiased bg-[#0a0a0a] text-slate-200 selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
